<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - QuoteFlow</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container" style="max-width: 400px; margin-top: 60px;">
        <h1 style="text-align: center; margin-bottom: 24px;">⚡ QuoteFlow</h1>
        <div class="card">
            <h2>Crear una Cuenta</h2>
            {% if error %}
            <p style="color: #ef4444; background: #fef2f2; padding: 10px; border-radius: 6px;">{{ error }}</p>
            {% endif %}
            <form action="/register" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="form-group">
                    <label>Correo Electrónico:</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Contraseña (mínimo 6 caracteres):</label>
                    <input type="password" name="password" required>
                </div>
                <div class="form-group">
                    <label>Confirmar Contraseña:</label>
                    <input type="password" name="confirm_password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Crear Cuenta</button>
            </form>
            <p style="text-align: center; margin-top: 16px;">
                ¿Ya tienes cuenta? <a href="/login">Inicia sesión</a>
            </p>
        </div>
    </div>
</body>
</html>
