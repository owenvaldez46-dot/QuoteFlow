<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Empresa | QuoteFlow</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div>
                <h1>⚙️ Configuración de Empresa</h1>
                <p>Personaliza tus presupuestos con tu logo y datos corporativos</p>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <a href="/dashboard" class="btn btn-secondary">📊 Dashboard</a>
                <a href="/" class="btn btn-primary">+ Nueva Cotización</a>
                <a href="/logout" class="btn btn-outline" style="color: #ef4444;">Cerrar Sesión</a>
            </div>
        </header>

        <div class="card">
            {% if saved %}
            <div style="background: #dcfce7; color: #166534; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #bbf7d0; font-weight: bold;">
                ✓ Perfil de empresa actualizado con éxito.
            </div>
            {% endif %}

            <form action="/settings" method="POST" enctype="multipart/form-data">
                <div style="margin-bottom: 24px; text-align: center;">
                    <label style="display: block; font-weight: bold; margin-bottom: 8px;">Logo de la Empresa</label>
                    {% if user.company_logo %}
                    <div style="margin-bottom: 12px;">
                        <img src="{{ user.company_logo }}" alt="Logo actual" style="max-height: 90px; border-radius: 8px; border: 1px solid #e2e8f0; padding: 4px;">
                    </div>
                    {% endif %}
                    <input type="file" name="logo" accept="image/png, image/jpeg, image/webp" style="margin: 0 auto;">
                    <small style="display: block; color: #64748b; margin-top: 4px;">PNG, JPG o WEBP (Recomendado 250x100px)</small>
                </div>

                <div class="form-group">
                    <label for="company_name">Nombre Comercial / Marca *</label>
                    <input type="text" id="company_name" name="company_name" value="{{ user.company_name or '' }}" placeholder="Ej. Mi Agencia Creativa SRL" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="company_phone">Teléfono / WhatsApp Comercial</label>
                        <input type="text" id="company_phone" name="company_phone" value="{{ user.company_phone or '' }}" placeholder="+1 809 555 0199">
                    </div>

                    <div class="form-group">
                        <label for="company_address">Dirección Física / Ubicación</label>
                        <input type="text" id="company_address" name="company_address" value="{{ user.company_address or '' }}" placeholder="Santo Domingo, República Dominicana">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">💾 Guardar Cambios</button>
            </form>
        </div>
    </div>
</body>
</html>
